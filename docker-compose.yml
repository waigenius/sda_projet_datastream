# docker-compose.yml — stack Datastream (Kafka KRaft + Airflow + ES/Kibana + Producer)
services:

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"     # pour les autres conteneurs (PLAINTEXT://kafka:9092)
      - "29092:29092"   # pour tests locaux (PLAINTEXT_HOST://localhost:29092)
    environment:
      # --- KRaft single-node (sans ZooKeeper) ---
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: "1"
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # --- CRUCIAL en single-node ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    networks: [projnet]

  create_topics:
    image: apache/kafka:3.8.0
    container_name: create-topics
    # Partage la pile réseau du broker → on parle à localhost:9092 (pas de DNS)
    network_mode: "service:kafka"
    depends_on: [kafka]
    entrypoint: ["/bin/bash","/app/create-topics.sh"]
    volumes:
      - ./kafka/create-topics.sh:/app/create-topics.sh:ro
    environment:
      KAFKA_BROKER: localhost:9092
      KAFKA_TOPIC_SOURCE: source
      KAFKA_TOPIC_RESULT: result

  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.2
    container_name: kafdrop
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
      SERVER_PORT: 9000
    depends_on: [kafka]
    ports:
      - "9000:9000"
    networks: [projnet]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks: [projnet]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_PUBLICBASEURL: http://localhost:5601
    depends_on: [elasticsearch]
    ports:
      - "5601:5601"
    networks: [projnet]

  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    container_name: airflow
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW_UID: "50000"
      EXPORT_DIR: /exports
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC_SOURCE: source
      KAFKA_TOPIC_RESULT: result
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ./exports:/exports
    depends_on: [kafka, elasticsearch]
    ports:
      - "8080:8080"
    command: >
      bash -lc "
      airflow db migrate &&
      airflow users create --username admin --firstname Air --lastname Flow --role Admin --email admin@example.com --password admin || true &&
      airflow webserver & airflow scheduler
      "
    networks: [projnet]

  producer:
    build:
      context: .
      dockerfile: docker/producer.Dockerfile
    container_name: producer
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC_SOURCE: source
      PRODUCER_RATE_PER_SEC: "5"
      DATA_SCHEMA_PATH: /app/data/data_projet.json
      PRODUCER_SKIP_VALIDATION: "true"   # on désactive tant que le schéma FR/EN n'est pas aligné
    volumes:
      - ./producer:/app/producer
      - ./data:/app/data
    depends_on: [kafka]
    command: python -u /app/producer/producer.py
    networks: [projnet]

volumes:
  airflow_logs:
  es_data:

networks:
  projnet: